<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@600;700;800&family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head><body style="margin:0;background:#0a0a0f"><canvas width="1080" height="1920"></canvas><script>
// Promonet v2 reel template. Node passes a timeline to init(); render(t) draws one frame.
const W=1080,H=1920, canvas=document.querySelector('canvas'), c=canvas.getContext('2d')
const C={paper:'#f5f5f2',ink:'#0a0a0f',blue:'#2540e8',blueSoft:'#e8ecff',muted:'#5b6170',line:'#dfe3ea',green:'#127a55',greenSoft:'#e3f3ea',orange:'#ff4a1c',orangeSoft:'#fff0eb',white:'#ffffff'}
const SANS='Inter, Arial, sans-serif', SLAB="'Roboto Slab', Georgia, serif", MONO="'JetBrains Mono', monospace"
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), ease=x=>1-Math.pow(1-clamp(x),3), back=x=>{x=clamp(x);const s=1.5;return 1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2)}
let cfg, vids={}

function font(size,weight=700,family=SANS){c.font=`${weight} ${size}px ${family}`}
function txt(s,x,y,size,color=C.ink,weight=700,family=SANS,align='left'){font(size,weight,family);c.fillStyle=color;c.textAlign=align;c.textBaseline='top';c.fillText(s,x,y);c.textAlign='left'}
function rr(x,y,w,h,r,fill,stroke,lw=2){c.beginPath();c.roundRect(x,y,w,h,r);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw;c.stroke()}}
function shadow(fn,blur=50,y=18,col='#0a0a0f40'){c.save();c.shadowColor=col;c.shadowBlur=blur;c.shadowOffsetY=y;fn();c.restore()}
function circle(x,y,r,fill){c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fillStyle=fill;c.fill()}
function seg(x1,y1,x2,y2,col,w=4,dash){c.save();c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';if(dash)c.setLineDash(dash);c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.restore()}
function tick(x,y,col=C.green,s=1){c.save();c.strokeStyle=col;c.lineWidth=7*s;c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(x,y+13*s);c.lineTo(x+11*s,y+24*s);c.lineTo(x+31*s,y);c.stroke();c.restore()}
function cross(x,y,col=C.orange,s=14){seg(x-s,y-s,x+s,y+s,col,6);seg(x+s,y-s,x-s,y+s,col,6)}
// Fade + rise an element in at local time `at`.
function enter(lt,at,fn,dur=.5,rise=50){const p=ease((lt-at)/dur);if(p<=0)return;c.save();c.globalAlpha*=p;c.translate(0,rise*(1-p));fn(p);c.restore()}
function pop(lt,at,cx,cy,fn,dur=.45){const p=clamp((lt-at)/dur);if(p<=0)return;const s=back(p);c.save();c.globalAlpha*=clamp(p*2);c.translate(cx,cy);c.scale(s,s);c.translate(-cx,-cy);fn();c.restore()}
function wrap(s,max,size,weight=800,family=SANS){font(size,weight,family);const out=[];let line='';for(const w of s.split(' ')){const test=line?line+' '+w:w;if(c.measureText(test).width>max&&line){out.push(line);line=w}else line=test}if(line)out.push(line);return out}

// ---------- footage ----------
function footage(v,lt,dur){
  const z=1.02+.045*clamp(lt/Math.max(dur,1)), r=Math.max(W/v.videoWidth,H/v.videoHeight)*z
  c.drawImage(v,(W-v.videoWidth*r)/2,(H-v.videoHeight*r)/2,v.videoWidth*r,v.videoHeight*r)
  let g=c.createLinearGradient(0,0,0,520);g.addColorStop(0,'#0a0a0f99');g.addColorStop(1,'#0a0a0f00');c.fillStyle=g;c.fillRect(0,0,W,520)
  g=c.createLinearGradient(0,1050,0,H);g.addColorStop(0,'#0a0a0f00');g.addColorStop(.55,'#0a0a0fa6');g.addColorStop(1,'#0a0a0fd9');c.fillStyle=g;c.fillRect(0,1050,W,H-1050)
}
function wordmark(x,y,size=50,col=C.white){font(size,800,SLAB);c.fillStyle=col;c.textBaseline='top';c.fillText('promonet',x,y);const w=c.measureText('promonet').width;c.fillStyle=C.orange;c.fillText('.',x+w,y)}

// ---------- captions: word-by-word reveal, max two lines ----------
function captions(t,beat){
  const ch=beat.chunks.find(k=>t>=k.start&&t<k.end+.12); if(!ch)return
  const lines=wrap(ch.text,880,66), lh=80, words=ch.text.split(' '), n=words.length, span=Math.max(.3,(ch.end-ch.start)*.8)
  let wi=0; const top=1500-lines.length*lh
  lines.forEach((ln,li)=>{
    font(66,800);let x=100;const y=top+li*lh
    const lw=c.measureText(ln).width
    c.save();c.globalAlpha=ease((t-ch.start)/.18);rr(78,y-10,lw+44,lh+6,18,'#0a0a0fbf');c.restore()
    for(const w of ln.split(' ')){
      const at=ch.start+span*(wi/n), p=ease((t-at)/.16), ww=c.measureText(w+' ').width
      c.save();c.globalAlpha=.25+.75*p;c.fillStyle=C.white;c.textBaseline='top';c.fillText(w,x,y+(1-p)*10);c.restore()
      x+=ww;wi++
    }
  })
}

// ---------- overlays ----------
function card(x,y,w,h,fn,fill=C.white){shadow(()=>rr(x,y,w,h,34,fill));fn()}
function chat(lt){
  enter(lt,.15,()=>card(85,360,910,640,()=>{
    circle(140,418,22,C.blue);circle(140,418,9,C.white);txt('AI assistant',178,402,30,C.ink,700)
    txt('Ask anything',760,406,24,C.muted,500)
    const q='Can you recommend a bike repair shop near me?', shown=q.slice(0,Math.floor(q.length*clamp((lt-.5)/1.3)))
    const ql=wrap(q,560,34,600)
    rr(345,470,610,ql.length*46+44,28,C.blue)
    let k=0;ql.forEach((l,i)=>{const part=shown.slice(k,k+l.length);k+=l.length+1;txt(part,375,492+i*46,34,C.white,600)})
    enter(lt,2.1,()=>{
      txt('Here are three well-reviewed options nearby:',125,640,30,C.ink,600)
      for(let i=0;i<3;i++){const y=700+i*86;rr(125,y,830,70,18,'#f2f4f8');circle(165,y+35,16,'#cfd6e4');rr(198,y+18,300-i*40,14,7,'#c8cfdb');rr(198,y+42,190+i*30,10,5,'#dde2ea');txt('★★★★★',800,y+20,26,'#e0a422',700)}
    },.45,30)
    pop(lt,3.4,540,975,()=>{rr(235,945,610,64,32,C.orangeSoft,C.orange,3);txt('Your business isn’t mentioned',540,962,30,C.orange,800,SANS,'center')})
  }))
}
function scan(lt){
  enter(lt,.1,()=>card(85,360,910,600,()=>{
    rr(85,360,910,76,34,'#edf0f5');rr(85,400,910,36,0,'#edf0f5');['#ff8c7c','#eac66a','#8cc8a5'].forEach((col,i)=>circle(130+i*28,398,8,col))
    rr(240,378,420,40,20,C.white);txt('your-business.co.uk',262,386,24,C.muted,600)
    txt('BIKE REPAIRS & SERVICING',130,478,24,C.blue,800,MONO)
    txt('Friendly local',130,522,58,C.ink,800,SLAB);txt('bike workshop.',130,590,58,C.ink,800,SLAB)
    for(let i=0;i<3;i++)rr(130,690+i*30,700-i*120,12,6,'#e2e6ee')
    rr(130,810,240,64,14,C.blue);txt('Book a repair',154,829,26,C.white,700)
    const p=(lt%2.4)/2.4, sy=450+p*480; const g=c.createLinearGradient(0,sy-120,0,sy);g.addColorStop(0,'#2540e800');g.addColorStop(1,'#2540e830');c.fillStyle=g;c.fillRect(97,sy-120,886,120);seg(97,sy,983,sy,C.blue,4)
  }))
  pop(lt,.9,780,330,()=>{rr(640,300,330,64,32,C.ink);circle(678,332,9,lt%0.8<.4?'#7cf0b2':'#3a8f68');txt('AI crawler visiting',700,317,26,C.white,700)})
  ;['Services?','Opening hours?','Area covered?'].forEach((s,i)=>pop(lt,2.6+i*.45,0,0,()=>{const x=[560,150,600][i],y=[470,760,700][i];rr(x,y,300,58,29,C.orangeSoft,C.orange,3);txt(s,x+150,y+14,27,C.orange,800,SANS,'center')}))
}
function checks(lt,beat){
  const items=[['Can AI access it?','Crawler access & page settings'],['Can AI understand it?','Readable, well-structured content'],['Is your business clear?','Who you help, what you do, where']]
  enter(lt,.05,()=>card(85,380,910,640,()=>{
    txt('YOUR FREE AI EVALUATION',130,425,26,C.blue,800,MONO)
    items.forEach(([h,s],i)=>{
      const at=(beat.chunks[i]?.start??beat.start+i)-beat.start, y=500+i*168
      enter(lt,at-.05,()=>{rr(125,y,830,140,24,'#f4f6fa');circle(195,y+70,36,ease((lt-at-.3)/.3)>0?C.greenSoft:'#e6e9ef');if(lt>at+.3)tick(178,y+57,C.green,1.05);txt(h,262,y+30,38,C.ink,800);txt(s,262,y+82,27,C.muted,500)},.4,30)
    })
  }))
}
function brand(lt){
  enter(lt,.25,()=>card(85,430,910,330,()=>{
    wordmark(135,490,104,C.ink)
    txt('Small business.',135,630,40,C.muted,600);txt('Helping small businesses.',135,680,40,C.blue,700)
  },C.paper))
  enter(lt,1.3,()=>{rr(85,790,620,64,32,'#0a0a0fcc');txt('20+ YEARS BUILDING CRM SOLUTIONS',117,810,24,C.white,700,MONO)},.45,24)
}
function offer(lt){
  enter(lt,.1,()=>card(85,380,910,600,()=>{
    rr(125,425,330,58,29,C.blueSoft);txt('FREE · 30 MINUTES',148,440,26,C.blue,800,MONO)
    txt('AI evaluation',125,520,84,C.ink,800,SLAB);txt('call',125,615,84,C.ink,800,SLAB)
    ;[1,2,3].forEach(i=>pop(lt,1.8+i*.35,175+(i-1)*120,800,()=>{circle(175+(i-1)*120,800,46,C.blue);txt(String(i),175+(i-1)*120,776,48,C.white,800,SANS,'center')}))
    enter(lt,3.1,()=>txt('clear next steps',490,778,44,C.ink,800),.4,20)
    enter(lt,3.3,()=>txt('Emailed after your call. Plain English.',125,880,30,C.muted,500),.4,20)
  }))
}
function price(lt,beat){
  const at=(beat.chunks[1]?.start??beat.start+3)-beat.start
  enter(lt,.2,()=>card(85,380,910,560,()=>{
    txt('WHY SO AFFORDABLE?',130,425,26,C.blue,800,MONO)
    txt('AI makes building',130,478,62,C.ink,800,SLAB);txt('software faster.',130,550,62,C.ink,800,SLAB)
    enter(lt,at,()=>{seg(130,660,950,660,C.line,3);txt('Simple connections from',130,690,34,C.muted,600);txt('£350',130,738,120,C.blue,800,SLAB);txt('total',430,800,40,C.muted,600)
      txt('Incl. any VAT · fixed quote after a feasibility check · third-party costs separate',130,890,21,C.muted,500)},.5,30)
  }))
}
// --- connected tools graphics ---
const TILES=[['Inbox','mail'],['Spreadsheet','grid'],['CRM','person']], TX=[85,415,745], TY=430, TS=250
function icon(kind,cx,cy,col){c.save();c.strokeStyle=col;c.fillStyle=col;c.lineWidth=7;c.lineJoin='round';c.lineCap='round'
  if(kind==='mail'){c.strokeRect(cx-48,cy-34,96,68);c.beginPath();c.moveTo(cx-48,cy-34);c.lineTo(cx,cy+6);c.lineTo(cx+48,cy-34);c.stroke()}
  if(kind==='grid'){c.strokeRect(cx-46,cy-40,92,80);seg(cx-46,cy-12,cx+46,cy-12,col,6);seg(cx-46,cy+14,cx+46,cy+14,col,6);seg(cx-12,cy-40,cx-12,cy+40,col,6)}
  if(kind==='person'){c.beginPath();c.arc(cx,cy-18,20,0,Math.PI*2);c.stroke();c.beginPath();c.arc(cx,cy+42,38,Math.PI*1.12,Math.PI*1.88);c.stroke()}
  c.restore()}
function tiles(lt,delay=0,shake=0){TILES.forEach(([label,kind],i)=>pop(lt,delay+i*.18,TX[i]+TS/2,TY+TS/2,()=>{const dx=shake?Math.sin(lt*30+i)*shake:0;shadow(()=>rr(TX[i]+dx,TY,TS,TS,36,C.white));icon(kind,TX[i]+TS/2+dx,TY+105,C.ink);txt(label,TX[i]+TS/2+dx,TY+178,30,C.ink,700,SANS,'center')}))}
function gaps(lt,at,col=C.orange){[0,1].forEach(i=>enter(lt,at+i*.2,()=>{const x1=TX[i]+TS+8,x2=TX[i+1]-8,y=TY+TS/2;seg(x1,y,x2,y,'#ffffffcc',5,[10,12]);cross((x1+x2)/2,y,col,13)},.35,0))}
function tilesApart(lt){tiles(lt,.15);gaps(lt,1.1);pop(lt,1.8,540,760,()=>{rr(270,730,540,68,34,C.orangeSoft,C.orange,3);txt('No connection between them',540,749,30,C.orange,800,SANS,'center')})}
function copying(lt){
  tiles(lt,0)
  const cycle=2.05, k=Math.max(0,lt-.6), n=Math.floor(k/cycle), p=(k%cycle)/cycle
  if(lt>.6){const leg=p<.5?0:1, q=ease((p-(leg?.5:0))/.42), x=TX[leg]+TS/2+(TX[leg+1]-TX[leg])*q, y=TY+TS+70-Math.sin(q*Math.PI)*60
    shadow(()=>rr(x-170,y-34,340,68,34,C.ink),24,8);txt('J. Smith · enquiry',x,y-17,28,C.white,700,SANS,'center')}
  pop(lt,1.4,540,880,()=>{rr(330,850,420,70,35,C.orange);txt(`Typed again ×${Math.max(1,n*2+(p>.5?2:1))}`,540,869,32,C.white,800,SANS,'center')})
}
function youLink(lt){
  tiles(lt,0)
  pop(lt,.4,540,860,()=>{circle(540,860,82,C.orange);txt('You',540,836,44,C.white,800,SANS,'center')})
  TILES.forEach((_,i)=>enter(lt,.7+i*.15,()=>{const off=(lt*40)%22;c.save();c.lineDashOffset=-off;seg(TX[i]+TS/2,TY+TS+6,540+(i-1)*40,790,C.orange,6,[12,10]);c.restore()},.3,0))
}
function connect(lt){
  tiles(lt,0)
  ;[0,1].forEach(i=>{const x1=TX[i]+TS,x2=TX[i+1],y=TY+TS/2,p=ease((lt-.3-i*.35)/.5);if(p<=0)return;seg(x1,y,x1+(x2-x1)*p,y,C.blue,10)
    if(p>=1)for(let d=0;d<2;d++){const q=((lt*.9+d/2+i*.25)%1);circle(x1+(x2-x1)*q,y,10,C.white)}})
  TILES.forEach((_,i)=>{if(lt>1.2+i*.2){circle(TX[i]+TS-22,TY+22,24,C.green);tick(TX[i]+TS-35,TY+12,C.white,.75)}})
  pop(lt,1.6,540,790,()=>{rr(250,755,580,72,36,C.greenSoft,C.green,3);txt('Connected · runs on its own',540,775,32,C.green,800,SANS,'center')})
}
const OVERLAYS={chat,scan,checks,brand,offer,price,tilesApart,copying,youAreTheLink:youLink,tilesConnect:connect,cta:()=>{},none:()=>{}}
const BOTTOM={chat:1012,scan:965,checks:1022,brand:858,offer:982,price:942,tilesApart:800,copying:922,youAreTheLink:944,tilesConnect:830}

// ---------- end card ----------
function endCard(t){
  const e=cfg.endCard, p=ease((t-cfg.endCardAt)/.55); if(p<=0)return
  c.save();c.translate(0,(1-p)*H*.35);c.globalAlpha=p
  c.fillStyle=C.paper;c.fillRect(0,0,W,H)
  c.fillStyle='#0a0a0f0d';for(let x=60;x<W;x+=60)for(let y=60;y<H;y+=60){c.fillRect(x,y,3,3)}
  wordmark(85,270,62,C.ink)
  txt(e.eyebrow,88,470,28,C.blue,800,MONO)
  e.title.split('\n').forEach((l,i)=>txt(l,82,530+i*138,126,C.ink,800,SLAB))
  const y0=530+e.title.split('\n').length*138+40
  e.sub.split('\n').forEach((l,i)=>txt(l,88,y0+i*58,46,C.muted,600))
  const by=y0+e.sub.split('\n').length*58+60
  shadow(()=>rr(85,by,910,132,66,C.blue),30,14,'#2540e855');txt(e.cta+'  →',540,by+42,46,C.white,800,SANS,'center')
  txt(e.url,540,by+172,36,C.ink,700,SANS,'center')
  e.note.forEach((l,i)=>txt(l,540,1470+i*36,23,C.muted,500,SANS,'center'))
  c.restore()
}

window.init=async config=>{
  cfg=config;vids={};await document.fonts.ready
  for(const f of ['800 40px "Roboto Slab"','800 40px Inter','700 40px Inter','600 40px Inter','500 40px Inter','800 20px "JetBrains Mono"','700 20px "JetBrains Mono"'])await document.fonts.load(f)
  for(const b of cfg.beats){const v=document.createElement('video');v.muted=true;v.preload='auto';v.src=b.clip;await new Promise((r,j)=>{v.onloadeddata=r;v.onerror=()=>j(new Error(b.clip))});vids[b.id]=v}
  return true
}
window.render=async t=>{
  const beat=cfg.beats.find(b=>t<b.end)||cfg.beats.at(-1), lt=t-beat.start, v=vids[beat.id]
  const target=Math.min(Math.max(0,lt),v.duration-.04)
  if(Math.abs(v.currentTime-target)>.001)await new Promise(r=>{v.onseeked=r;v.currentTime=target})
  c.fillStyle=C.ink;c.fillRect(0,0,W,H)
  footage(v,lt,beat.end-beat.start)
  if(t<cfg.endCardAt+.6){
    wordmark(85,265,50)
    // Overlays are drawn in a 1080-wide design space, then scaled into the lower third so faces stay clear.
    const bottom=BOTTOM[beat.overlay]; c.save(); if(bottom){c.translate(540,1315);c.scale(.8,.8);c.translate(-540,-bottom)}
    OVERLAYS[beat.overlay](lt,beat); c.restore()
    if(cfg.captions)captions(t,beat)
  }
  endCard(t)
  return canvas.toDataURL('image/jpeg',.92).split(',')[1]
}
</script></body></html>
